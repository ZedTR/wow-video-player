<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waiting on My Wife - Player</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  #player { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  var ids = (params.get('ids') || params.get('v') || '').split(',').filter(Boolean);

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  var player;
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '100%',
      width: '100%',
      videoId: ids[0],
      playerVars: {
        autoplay: 1,
        playsinline: 1,
        rel: 0,
        playlist: ids.slice(1).join(',')
      },
      events: {
        onReady: function (event) {
          event.target.playVideo();
        },
        onStateChange: function (event) {
          if (event.data !== YT.PlayerState.ENDED) return;
          var list = player.getPlaylist() || [];
          var index = player.getPlaylistIndex();
          var atEnd = list.length === 0 || index === list.length - 1;
          if (atEnd && window.VideosEnded) {
            window.VideosEnded.postMessage('ended');
          }
        }
      }
    });
  }
</script>
</body>
</html>
