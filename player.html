<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waiting on My Wife - Player</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  #player { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
  #privacy-link {
    position: fixed;
    bottom: 4px;
    right: 8px;
    z-index: 10;
    font: 10px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
    color: rgba(255, 255, 255, 0.55);
    text-decoration: none;
  }
  #privacy-link:hover { color: rgba(255, 255, 255, 0.85); }
</style>
</head>
<body>
<div id="player"></div>
<a id="privacy-link" href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>
<script>
  var params = new URLSearchParams(window.location.search);
  var ids = (params.get('ids') || params.get('v') || '').split(',').filter(Boolean);

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  var player;
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '100%',
      width: '100%',
      videoId: ids[0],
      playerVars: {
        autoplay: 1,
        playsinline: 1,
        rel: 0,
        playlist: ids.slice(1).join(',')
      },
      events: {
        onReady: function (event) {
          event.target.playVideo();
        },
        onStateChange: function (event) {
          if (event.data !== YT.PlayerState.ENDED) return;
          handleAdvance();
        },
        onError: function () {
          // This video is broken (removed, restricted, etc.) - skip it
          // instead of getting stuck on YouTube's error card.
          handleAdvance();
        }
      }
    });
  }

  function handleAdvance() {
    var list = player.getPlaylist() || [];
    var index = player.getPlaylistIndex();
    var atEnd = list.length === 0 || index === list.length - 1;
    if (atEnd) {
      if (window.VideosEnded) {
        window.VideosEnded.postMessage('ended');
      }
    } else {
      player.nextVideo();
    }
  }
</script>
</body>
</html>
